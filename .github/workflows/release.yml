name: Release

# Step 2 of a release (see the Guardian SDK Release Guide on Confluence, AA1 1156121307).
# Runs on every push to master and carries on only when the pushed commit is the
# squash merge of a release/X.Y.Z PR (opened by prepare-release.yml). It runs on
# the push rather than on the PR's "closed" event so that github.ref is master,
# which is what an environment restricted to master expects.
#
# Manual run, only to redo a release (for example after fixing an environment
# problem): Actions tab, Release, Run workflow, branch master, with the version.
# It releases the merge commit of the newest merged release/X.Y.Z PR, not master's
# head, and fails if there is no such PR (Prepare release was never run or merged).
#
# Jobs: validate-version -> test -> publish (maven-central-release approval gate)
#       -> validate-release.
# Test is skipped when the release PR's Test check already passed on a commit with
# exactly the same tree as the merge commit (the usual case: the release branch was
# up to date with master), since it would run the same suite on the same files.
# After approval, publish:
#   1. creates the GitHub Release X.Y.Z as a DRAFT targeting the merge commit
#      (a draft does not create the tag), with the CHANGELOG entry as its body;
#   2. uploads to Maven Central staging;
#   3. publishes the draft, which creates the X.Y.Z tag on the merge commit.
# Then validate-release (validate-release.yml, stage staged) checks the GitHub side
# of the release: the Release and its notes, the tag, master's versions and this
# run. It reports a pass or fail table and never changes the release.
# Then promote the staging deployment by hand at https://central.sonatype.com, and
# run Validate release by hand with stage published to check Maven Central.
#
# Re-runs never need a manual cleanup: a failed upload leaves only the draft,
# which the next run reuses. A newer run for the same version cancels older runs
# that have not started publishing, and publish refuses to run if a newer run for
# its version exists, so approving a stale run does nothing.
#
# Required GitHub environment: maven-central-release, with required reviewers
# and these ENVIRONMENT secrets (not repo-wide, so only the publish job can read
# them, and only after approval):
#   MAVEN_CENTRAL_USERNAME       Maven Central Portal username
#   MAVEN_CENTRAL_PASSWORD       Maven Central Portal password
#   SIGNING_KEY_ID               GPG public key ID
#   SIGNING_KEY_PASSWORD         GPG secret key passphrase
#   SIGNING_SECRET_KEY_RING_B64  base64-encoded secring.gpg (base64 -i secring.gpg | pbcopy)

# Manual runs carry the version in their title; the superseding logic below reads it back.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release {0} (manual)', inputs.version) || '' }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z). Run on master."
        required: true
        type: string
      # A confirmation, not an action: the workflow cannot tell which staging upload
      # is which, so it trusts this. Leave it unticked for every normal release, for
      # re-running a failed run and for any other manual run. Tick it only when an
      # earlier run uploaded this version, nobody clicked Publish, a fix for the same
      # version was merged, the new run stopped with "already uploaded to staging
      # from another commit", and you clicked Drop on the old upload in the Portal.
      # Once a version is Published it can never change: release the fix as the
      # next version. (The input keeps its name; the form shows the description.)
      staging_dropped:
        description: "Replace an unpublished upload: tick only after you clicked Drop on this version's earlier upload in the Maven Central Portal"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  # ── 1. Detect and validate the release, supersede older runs ──────────────
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # map the pushed commit to its release PR
      actions: write       # cancel superseded runs
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
      sha: ${{ steps.detect.outputs.sha }}
      pr: ${{ steps.detect.outputs.pr }}
      tested: ${{ steps.tested.outputs.tested }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Detect release
        id: detect
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "::error::Run Release on master (it ran on ${GITHUB_REF_NAME})."
              exit 1
            fi
            version="$INPUT_VERSION"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'$version' is not X.Y.Z."
              exit 1
            fi
            # Release exactly what was reviewed: the merge commit of the newest merged
            # release/X.Y.Z PR (a correction PR, if there was one), never master's head,
            # which may carry changes merged after the release PR.
            IFS=$'\t' read -r sha pr_number < <(gh pr list --repo "$REPO" --head "release/$version" --base master --state merged \
              --json mergeCommit,mergedAt,number --jq 'sort_by(.mergedAt) | last // empty | "\(.mergeCommit.oid)\t\(.number)"') || true
            if [[ -z "${sha:-}" ]]; then
              echo "::error::No merged release/$version PR. Run Prepare release for $version and merge its PR first."
              exit 1
            fi
          else
            # The squash merge of a release/X.Y.Z PR into master, or nothing to do.
            # GitHub can take a while to link a fresh merge commit to its PR, and a run
            # that starts seconds after the merge can find no PR yet. So first try the
            # PR number in the squash title ("Release X.Y.Z (#N)"), which resolves at
            # once and also settles ordinary merges quickly, then fall back to the
            # commit-to-PR lookup with retries before deciding this is not a release.
            # Prints the PR's head ref and number, or nothing if it is not this merge.
            pr_by_number() {
              gh api "repos/$REPO/pulls/$1" --jq \
                "select(.merged_at != null and .base.ref == \"master\" and .merge_commit_sha == \"$sha\") | \"\(.head.ref)\t\(.number)\""
            }
            pr_by_commit() {
              gh api "repos/$REPO/commits/$sha/pulls" --jq \
                '[.[] | select(.merged_at != null and .base.ref == "master")] | sort_by(.head.ref | startswith("release/") | not) | .[0] // empty | "\(.head.ref)\t\(.number)"'
            }
            title="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH" | head -1)"
            number="$(sed -nE 's/.*\(#([0-9]+)\)$/\1/p' <<<"$title")"
            found=""
            if [[ -n "$number" ]]; then
              found="$(pr_by_number "$number" || true)"
            fi
            attempts=6
            for attempt in $(seq 1 "$attempts"); do
              [[ -n "$found" ]] && break
              found="$(pr_by_commit || true)"
              if [[ -z "$found" && "$attempt" -lt "$attempts" ]]; then
                echo "No merged PR linked to $sha yet (attempt $attempt of $attempts); retrying in 5 seconds."
                sleep 5
              fi
            done
            IFS=$'\t' read -r head_ref pr_number <<<"$found" || true
            if [[ ! "${head_ref:-}" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Not a release merge; nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="${head_ref#release/}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not X.Y.Z."
            exit 1
          fi
          {
            echo "release=true"
            echo "version=$version"
            echo "sha=$sha"
            echo "pr=$pr_number"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version from $sha (PR #$pr_number)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        if: steps.detect.outputs.release == 'true'
        with:
          ref: ${{ steps.detect.outputs.sha }}

      - name: Check the version files and the registry
        if: steps.detect.outputs.release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < .version)"
          if [[ "$current" != "$VERSION" ]]; then
            echo "::error::.version on this commit is '$current', expected $VERSION. Run Prepare release for $VERSION."
            exit 1
          fi
          if ! grep -qF "## [${VERSION}](" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi
          pom="https://repo1.maven.org/maven2/com/auth0/android/guardian/${VERSION}/guardian-${VERSION}.pom"
          if [[ "$(curl -s -o /dev/null -w '%{http_code}' "$pom")" == "200" ]]; then
            echo "::error::$VERSION is already on Maven Central. Release the next version instead."
            exit 1
          fi

      # Same tree as the release PR's head, and the PR's Test check passed there:
      # the PR checks already ran the suite on exactly these files. Any difference
      # (master moved after the PR's last check) and the Test job runs as before.
      - name: Check whether the release PR already tested this tree
        id: tested
        if: steps.detect.outputs.release == 'true'
        env:
          SHA: ${{ steps.detect.outputs.sha }}
          PR: ${{ steps.detect.outputs.pr }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
          merge_tree="$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)"
          head_tree="$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)"
          # The latest Test check run on the PR head, from GitHub Actions (pr.yml).
          tests="$(gh api "repos/$REPO/commits/$head/check-runs?check_name=Test&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | if length == 0 then "none" elif all(.conclusion == "success") then "success" else "failed" end')"
          if [[ "$merge_tree" == "$head_tree" && "$tests" == "success" ]]; then
            echo "Release PR #$PR passed Test on ${head:0:7}, whose tree is identical to ${SHA:0:7}; skipping the Test job."
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "note=Passed on the release PR head ${head:0:7}, same tree as this commit, so not run again" >> "$GITHUB_OUTPUT"
          else
            echo "Running Test: tree ${merge_tree:0:7} vs PR head ${head_tree:0:7}, PR Test check: $tests."
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "note=Run in this workflow (the merged tree differs from the PR head, or the PR's Test check did not pass)" >> "$GITHUB_OUTPUT"
          fi

      # What the approver reads on the run page, right above the approval button.
      - name: Summarise the release for the approver
        if: steps.detect.outputs.release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          SHA: ${{ steps.detect.outputs.sha }}
          PR: ${{ steps.detect.outputs.pr }}
          TESTS: ${{ steps.tested.outputs.note }}
        run: |
          set -euo pipefail
          {
            echo "### Guardian.Android $VERSION is waiting for approval"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| SDK | Guardian.Android (com.auth0.android:guardian on Maven Central) |"
            echo "| Version | $VERSION |"
            echo "| Commit | [\`${SHA:0:7}\`]($GITHUB_SERVER_URL/$REPO/commit/$SHA) |"
            echo "| Release PR | [#$PR]($GITHUB_SERVER_URL/$REPO/pull/$PR) |"
            echo "| Tests | $TESTS |"
            echo
            echo "Approving uploads $VERSION to Maven Central staging. It goes public only after someone clicks Publish in the Maven Central Portal."
            echo
            echo "#### CHANGELOG entry"
            echo
            awk -v h="## [${VERSION}](" '
              index($0, h) == 1 { on = 1; next }
              on && /^## \[/    { exit }
              on                { print }
            ' CHANGELOG.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Cancel older runs for the same version that have not started publishing:
      # still validating or testing, or waiting at the approval gate. A run whose
      # publish job is already executing is left alone.
      - name: Supersede older runs for this version
        if: steps.detect.outputs.release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          run_version() {  # event head_sha title -> the version that run releases
            if [[ "$1" == "workflow_dispatch" ]]; then
              sed -nE 's/^Release ([0-9]+\.[0-9]+\.[0-9]+) \(manual\)$/\1/p' <<<"$3"
            else
              gh api "repos/$REPO/commits/$2/pulls" \
                --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release/")))][0].head.ref // "" | ltrimstr("release/")'
            fi
          }
          for status in queued in_progress waiting; do
            gh api "repos/$REPO/actions/workflows/release.yml/runs?status=$status&per_page=100" \
              --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID) | [.id, .event, .head_sha, .display_title] | @tsv"
          done | while IFS=$'\t' read -r id event head_sha title; do
            [[ "$(run_version "$event" "$head_sha" "$title")" == "$VERSION" ]] || continue
            publishing="$(gh api "repos/$REPO/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select((.name | startswith("Publish")) and .status == "in_progress")] | length')"
            if [[ "$publishing" != "0" ]]; then
              echo "Run $id is already publishing $VERSION; leaving it."
              continue
            fi
            echo "Cancelling superseded run $id for $VERSION."
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
          done

  # ── 2. Run tests on the exact commit being released ───────────────────────
  test:
    name: Test
    needs: validate-version
    if: needs.validate-version.outputs.release == 'true' && needs.validate-version.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          ref: ${{ needs.validate-version.outputs.sha }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # pin@v6.1.0
        with:
          distribution: temurin
          java-version-file: '.java-version'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # pin@v6.4.0

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # pin@v1.331.0
        with:
          bundler: 'Gemfile.lock'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: ~/vendor/bundle
          key: bundle-v1-${{ hashFiles('fastlane/Gemfile.lock') }}
          restore-keys: bundle-v1-

      - name: Install Ruby dependencies
        run: bundle check || bundle install --jobs 4 --retry 3
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
          BUNDLE_PATH: ~/vendor/bundle

      # --test + --coverage resolves to the single coverage lane: it runs the :guardian
      # unit tests once with JaCoCo and enforces the 80% line-coverage gate.
      - name: Test
        run: ./build.sh --buildType debug --test --coverage --nobuild --nolint --nopublish --skip-deps
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
          BUNDLE_PATH: ~/vendor/bundle

      # build.sh's postbuild hook writes reports.html on success and then cleans the
      # raw jacoco dirs; on failure it doesn't, so regenerate it here.
      - name: Generate reports.html (failure fallback)
        if: failure()
        run: ./tools/build/reports.sh
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
          BUNDLE_PATH: ~/vendor/bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7.0.2
        if: always()
        with:
          name: reports
          path: guardian/build/reports/reports.html

  # ── 3. Publish ─────────────────────────────────────────────────────────────
  # The maven-central-release environment supplies BOTH the approval gate
  # (required reviewers) AND the Maven/signing secrets, so approval and secret
  # scoping attach to the one job that uses the credentials.
  publish:
    # The SDK and version show in the review email, the run page and the approval
    # dialog, so the approver knows what they are publishing.
    name: Publish Guardian.Android ${{ needs.validate-version.outputs.version }} to Maven Central staging
    needs: [validate-version, test]
    # Test is either run and green, or skipped because the release PR already ran it.
    if: >-
      !cancelled() && needs.validate-version.result == 'success' && needs.validate-version.outputs.release == 'true' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.validate-version.outputs.tested == 'true'))
    runs-on: ubuntu-latest
    # No job-level timeout: the approval wait counts against it, so a job timeout
    # would cancel the job if a reviewer takes longer than the limit. The
    # environment has its own deployment timeout; the long steps have their own.
    environment: maven-central-release
    # Never two publishes for one version at once, and never cancel one mid-flight.
    concurrency:
      group: maven-central-publish-${{ needs.validate-version.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write       # GitHub Release and its tag
      actions: read         # newest-run check
      pull-requests: read   # newest-run check maps runs to their release PR
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate-version.outputs.version }}
      SHA: ${{ needs.validate-version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          ref: ${{ needs.validate-version.outputs.sha }}

      # Approving a stale run must do nothing: if a newer Release run exists for
      # this version (a correction was merged), stop before anything public.
      - name: Check this is the newest run for the version
        run: |
          set -euo pipefail
          run_version() {  # event head_sha title -> the version that run releases
            if [[ "$1" == "workflow_dispatch" ]]; then
              sed -nE 's/^Release ([0-9]+\.[0-9]+\.[0-9]+) \(manual\)$/\1/p' <<<"$3"
            else
              gh api "repos/$REPO/commits/$2/pulls" \
                --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release/")))][0].head.ref // "" | ltrimstr("release/")'
            fi
          }
          gh api "repos/$REPO/actions/workflows/release.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id > $GITHUB_RUN_ID) | [.id, .event, .head_sha, .display_title] | @tsv" \
          | while IFS=$'\t' read -r id event head_sha title; do
            if [[ "$(run_version "$event" "$head_sha" "$title")" == "$VERSION" ]]; then
              echo "::error::A newer Release run exists for $VERSION (run $id). This run is superseded: approve the newer run, or if that one failed, start Release again for $VERSION from the Actions tab."
              exit 1
            fi
          done

      # Decide what this run has to do, from what earlier runs left behind:
      #   nothing yet                      -> create the draft, upload, publish it
      #   a draft Release                  -> reuse it (pointed at this commit), upload, publish it
      #   a published Release on this SHA  -> the upload already happened: promote in the Portal
      #   a published Release elsewhere    -> correction after an earlier upload: only once the
      #                                       earlier staging deployment was dropped by hand
      - name: Preflight
        id: preflight
        env:
          STAGING_DROPPED: ${{ inputs.staging_dropped }}
        run: |
          set -euo pipefail
          pom="https://repo1.maven.org/maven2/com/auth0/android/guardian/${VERSION}/guardian-${VERSION}.pom"
          if [[ "$(curl -s -o /dev/null -w '%{http_code}' "$pom")" == "200" ]]; then
            echo "::error::$VERSION is already on Maven Central. Release the next version instead."
            exit 1
          fi
          # Look the Release up by id rather than through `gh release view`: GitHub can
          # give a draft an "untagged-..." tag name, so match a draft by its title too.
          # VERSION is validated as X.Y.Z, so it is safe inside the jq filter.
          release="$(gh api "repos/$REPO/releases?per_page=100" --jq \
            "[.[] | select(.tag_name == \"$VERSION\" or (.draft and .name == \"$VERSION\"))][0] // {}")"
          release_id="$(jq -r '.id // ""' <<<"$release")"
          if [[ -z "$release_id" ]]; then
            state="none"
          elif [[ "$(jq -r .draft <<<"$release")" == "true" ]]; then
            state="draft"
          else
            state="published"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          if [[ "$state" == "published" ]]; then
            tag_sha="$(gh api "repos/$REPO/commits/$VERSION" --jq .sha)"
            if [[ "$tag_sha" == "$SHA" ]]; then
              echo "::notice::$VERSION was already uploaded to staging from this commit. Promote it at https://central.sonatype.com; nothing to redo."
              echo "action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$STAGING_DROPPED" != "true" ]]; then
              echo "::error::$VERSION was already uploaded to staging from another commit, $tag_sha (this run is for $SHA). In the Maven Central Portal, Deployments, click Drop on that upload, then run Release by hand for $VERSION with 'Replace an unpublished upload' ticked. If $VERSION was already Published there, it can no longer change: release the fix as the next version."
              exit 1
            fi
            echo "'Replace an unpublished upload' is ticked: the earlier upload was dropped, so moving the Release and tag to $SHA and uploading again."
            state="moved"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "action=publish" >> "$GITHUB_OUTPUT"

      - name: Extract the CHANGELOG entry
        if: steps.preflight.outputs.action == 'publish'
        run: |
          set -euo pipefail
          awk -v h="## [${VERSION}](" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/    { exit }
            on                { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::error::Empty CHANGELOG entry for $VERSION."
            exit 1
          fi

      # Android consumers never resolve the tag, so moving it is safe until the
      # Portal promotion, and it keeps the tag on the commit that actually ships.
      - name: Create or update the draft GitHub Release
        id: draft
        if: steps.preflight.outputs.action == 'publish'
        env:
          STATE: ${{ steps.preflight.outputs.state }}
          RELEASE_ID: ${{ steps.preflight.outputs.release_id }}
        run: |
          set -euo pipefail
          if [[ "$STATE" == "moved" ]]; then
            gh api -X DELETE "repos/$REPO/releases/$RELEASE_ID"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$VERSION"
            STATE="none"
          fi
          # Always send tag_name: updating a draft without it resets the tag name.
          if [[ "$STATE" == "draft" ]]; then
            id="$(gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -f tag_name="$VERSION" \
              -f target_commitish="$SHA" -f name="$VERSION" -F body=@/tmp/release-notes.md --jq .id)"
            echo "Reused the draft Release $VERSION, now targeting $SHA."
          else
            id="$(gh api "repos/$REPO/releases" -f tag_name="$VERSION" -f target_commitish="$SHA" \
              -f name="$VERSION" -F body=@/tmp/release-notes.md -F draft=true --jq .id)"
            echo "Created the draft Release $VERSION targeting $SHA."
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # pin@v6.1.0
        if: steps.preflight.outputs.action == 'publish'
        with:
          distribution: temurin
          java-version-file: '.java-version'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # pin@v6.4.0
        if: steps.preflight.outputs.action == 'publish'

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # pin@v1.331.0
        if: steps.preflight.outputs.action == 'publish'
        with:
          bundler: 'Gemfile.lock'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        if: steps.preflight.outputs.action == 'publish'
        with:
          path: ~/vendor/bundle
          key: bundle-v1-${{ hashFiles('fastlane/Gemfile.lock') }}
          restore-keys: bundle-v1-

      - name: Install Ruby dependencies
        if: steps.preflight.outputs.action == 'publish'
        run: bundle check || bundle install --jobs 4 --retry 3
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
          BUNDLE_PATH: ~/vendor/bundle

      # signing.* properties contain dots, so they can't be env vars and must be
      # written to ~/.gradle/gradle.properties. The delimiter is QUOTED (<<'EOF')
      # so a secret containing $, a backtick or $(...) is written literally and
      # never shell-expanded. The cleanup step removes the file afterwards.
      - name: Configure signing and Maven Central credentials
        if: steps.preflight.outputs.action == 'publish'
        run: |
          set -euo pipefail
          echo "${{ secrets.SIGNING_SECRET_KEY_RING_B64 }}" | base64 --decode > /tmp/secring.gpg
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          mavenCentralUsername=${{ secrets.MAVEN_CENTRAL_USERNAME }}
          mavenCentralPassword=${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signing.keyId=${{ secrets.SIGNING_KEY_ID }}
          signing.password=${{ secrets.SIGNING_KEY_PASSWORD }}
          signing.secretKeyRingFile=/tmp/secring.gpg
          EOF

      # publishToMavenCentral(false) in guardian/build.gradle uploads to staging
      # and does NOT release; promotion in the Portal is a deliberate manual step.
      - name: Publish to Maven Central (staging)
        if: steps.preflight.outputs.action == 'publish'
        timeout-minutes: 30
        run: ./build.sh --buildType release --notest --nolint --nocoverage --publish --nobuild --skip-deps
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
          BUNDLE_PATH: ~/vendor/bundle
          RELEASE_CONTEXT: "true"

      # Publishing the draft creates the X.Y.Z tag on the merge commit. Only
      # reached once the upload succeeded, so a failed upload leaves just the draft.
      - name: Publish the GitHub Release (creates the tag)
        if: steps.preflight.outputs.action == 'publish'
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -f tag_name="$VERSION" \
            -f target_commitish="$SHA" -F draft=false >/dev/null
          tag_sha="$(gh api "repos/$REPO/commits/$VERSION" --jq .sha)"
          if [[ "$tag_sha" != "$SHA" ]]; then
            echo "::error::Tag $VERSION points at $tag_sha, expected $SHA."
            exit 1
          fi
          {
            echo "### $VERSION uploaded to Maven Central staging"
            echo
            echo "Next: open https://central.sonatype.com, Deployments, check the com.auth0.android:guardian $VERSION deployment (files and POM) and click Publish."
            echo "It is public about 10 to 15 minutes later at https://repo.maven.apache.org/maven2/com/auth0/android/guardian/$VERSION/"
            echo "Then run Validate release by hand for $VERSION with stage published, to check Maven Central."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up credentials
        if: always()
        run: |
          rm -f /tmp/secring.gpg
          sed -i '/mavenCentralUsername\|mavenCentralPassword\|signing\./d' \
            ~/.gradle/gradle.properties 2>/dev/null || true

  # ── 4. Check the GitHub side of the release ────────────────────────────────
  # Also after a run that had nothing left to redo, so the report covers it too.
  # Maven Central is checked after the Portal promotion, by hand (stage published).
  validate-release:
    name: Validate release
    needs: [validate-version, publish]
    if: "!cancelled() && needs.publish.result == 'success'"
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/validate-release.yml
    with:
      version: ${{ needs.validate-version.outputs.version }}
      stage: staged
